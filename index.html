<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Dino 3D</title>
<style>
  /* ---------------------------------------------------------------------------
     The intro is not a lookalike of Chrome's offline page -- it IS that page.
     Everything from ":root" down to the end of the "offline error page" block is
     lifted verbatim from Chromium's own stylesheets:

       components/security_interstitials/core/common/resources/interstitial_core.css
       components/security_interstitials/core/common/resources/interstitial_common.css
       components/neterror/resources/neterror.css

     kept in that cascade order, trimmed to the rules the offline path actually
     uses. That is also where the responsive behaviour comes from: the small-
     screen, short-screen and landscape breakpoints below are Chrome's, not ours,
     so the page reflows exactly like the real thing at every size.

     Our own additions are marked. The dinosaur is the only thing that differs:
     .icon-offline is an empty 72x72 replaced box rather than the sprite, because
     the real 3D model is framed into the runner container behind it.
  --------------------------------------------------------------------------- */

  /* --- interstitial_core.css ---------------------------------------------- */
  html {
    -webkit-text-size-adjust: 100%;
    font-size: 125%;
  }
  body {
    --background-color: #fff;
    --error-code-color: var(--google-gray-700);
    --google-blue-300: rgb(138, 180, 248);
    --google-blue-600: rgb(26, 115, 232);
    --google-blue-700: rgb(25, 103, 210);
    --google-gray-100: rgb(241, 243, 244);
    --google-gray-500: rgb(154, 160, 166);
    --google-gray-700: rgb(95, 99, 104);
    --google-gray-900: rgb(32, 33, 36);
    --heading-color: var(--google-gray-900);
    --link-color: rgb(88, 88, 88);
    --primary-button-fill-color-active: var(--google-blue-700);
    --primary-button-fill-color: var(--google-blue-600);
    --primary-button-text-color: #fff;
    --text-color: var(--google-gray-700);
    background: var(--background-color);
    color: var(--text-color);
    word-wrap: break-word;
  }
  @media (prefers-color-scheme: dark) {
    body {
      --background-color: var(--google-gray-900);
      --error-code-color: var(--google-gray-500);
      --heading-color: var(--google-gray-500);
      --link-color: var(--google-blue-300);
      --primary-button-fill-color-active: rgb(129, 162, 208);
      --primary-button-fill-color: var(--google-blue-300);
      --primary-button-text-color: var(--google-gray-900);
      --text-color: var(--google-gray-500);
    }
  }

  /* --- interstitial_common.css -------------------------------------------- */
  button {
    border: 0;
    border-radius: 20px;
    box-sizing: border-box;
    color: var(--primary-button-text-color);
    cursor: pointer;
    float: right;
    font-size: .875em;
    margin: 0;
    padding: 8px 16px;
    transition: box-shadow 150ms cubic-bezier(0.4, 0, 0.2, 1);
    user-select: none;
  }
  .neterror button { background: var(--primary-button-fill-color); }
  button:active { background: var(--primary-button-fill-color-active); outline: 0; }
  .error-code {
    color: var(--error-code-color);
    font-size: .8em;
    margin-top: 12px;
    text-transform: uppercase;
  }
  h1 {
    color: var(--heading-color);
    font-size: 1.6em;
    font-weight: normal;
    line-height: 1.25em;
    margin-bottom: 16px;
  }
  .icon { height: 72px; margin: 0 0 40px; width: 72px; }
  .interstitial-wrapper {
    box-sizing: border-box;
    font-size: 1em;
    line-height: 1.6em;
    margin: 14vh auto 0;
    max-width: 600px;
    width: 100%;
  }
  .nav-wrapper { margin-top: 51px; }
  .nav-wrapper::after { clear: both; content: ''; display: table; width: 100%; }
  @media (max-width: 700px) {
    .interstitial-wrapper { padding: 0 10%; }
  }
  @media (max-width: 420px) {
    button, .small-link {
      float: none; font-size: .825em; font-weight: 500; margin: 0; width: 100%;
    }
  }
  @media (min-width: 240px) and (max-width: 420px) and (min-height: 401px),
         (min-width: 421px) and (min-height: 240px) and (max-height: 560px) {
    body .nav-wrapper {
      background: var(--background-color);
      bottom: 0;
      box-shadow: 0 -12px 24px var(--background-color);
      left: 0;
      margin: 0 auto;
      max-width: 736px;
      padding-inline-end: 24px;
      padding-inline-start: 24px;
      position: fixed;
      right: 0;
      width: 100%;
      z-index: 2;
    }
    .interstitial-wrapper { max-width: 736px; }
    #main-content { padding-bottom: 40px; }
  }
  @media (max-width: 420px) and (orientation: portrait), (max-height: 560px) {
    button { font-size: .933em; margin: 6px 0; transform: translatez(0); }
    .nav-wrapper { box-sizing: border-box; padding-bottom: 8px; width: 100%; }
    h1 { font-size: 1.5em; margin-bottom: 8px; }
    .icon { margin-bottom: 5.69vh; }
    .interstitial-wrapper {
      box-sizing: border-box; margin: 7vh auto 12px; padding: 0 24px; position: relative;
    }
    .interstitial-wrapper p { font-size: .95em; line-height: 1.61em; margin-top: 8px; }
    #main-content { margin: 0; }
    .suggested-left > #control-buttons { float: none; margin: 0; }
  }
  @media (min-width: 421px) and (min-height: 500px) and (max-height: 560px) {
    .interstitial-wrapper { margin-top: 10vh; }
  }
  @media (min-height: 400px) and (orientation: portrait) {
    .interstitial-wrapper { margin-bottom: 145px; }
  }
  @media (min-height: 299px) { .nav-wrapper { padding-bottom: 16px; } }
  @media (min-height: 500px) and (max-height: 650px) and (max-width: 414px) and (orientation: portrait) {
    .interstitial-wrapper { margin-top: 7vh; }
  }
  @media (min-height: 650px) and (max-width: 414px) and (orientation: portrait) {
    .interstitial-wrapper { margin-top: 10vh; }
  }
  @media (max-height: 400px) and (orientation: portrait),
         (max-height: 239px) and (orientation: landscape),
         (max-width: 419px) and (max-height: 399px) {
    .interstitial-wrapper { display: flex; flex-direction: column; margin-bottom: 0; }
    #main-content { flex: 1 1 auto; order: 0; }
    .nav-wrapper {
      flex: 0 1 auto; margin-top: 8px; order: 1;
      padding-inline-end: 0; padding-inline-start: 0; position: relative; width: 100%;
    }
    button { padding: 16px 24px; }
  }

  /* --- neterror.css -------------------------------------------------------- */
  h1 { margin-top: 0; word-wrap: break-word; }
  h1 span { font-weight: 500; }
  a { text-decoration: none; }
  .icon { -webkit-user-select: none; display: inline-block; }
  /* Chrome's .icon-offline is `content: image-set(...)` -- a REPLACED box, which
     is what makes the gap above the heading what it is. Ours is a transparent
     72x72 SVG so the box behaves identically while drawing nothing: the dino you
     see is the WebGL model, framed into .runner-container. */
  .icon-offline {
    content: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='72' height='72'/%3E");
    position: relative;
  }
  #suggestions-list p { margin-block-end: 0; }
  #suggestions-list ul { margin-top: 0; }
  .offline .interstitial-wrapper {
    color: var(--text-color);
    font-size: 1em;
    line-height: 1.55;
    margin: 0 auto;
    max-width: 600px;
    padding-top: 100px;
    position: relative;
    width: 100%;
  }
  .offline .runner-container {
    direction: ltr;
    height: 150px;
    max-width: 600px;
    overflow: hidden;
    position: absolute;
    top: 35px;
    width: 44px;
  }
  .suggested-left > #control-buttons { float: left; }
  @media (max-width: 640px), (max-height: 640px) {
    h1 { margin: 0 0 15px; }
    .suggestions { margin-top: 10px; }
  }
  @media (max-width: 420px) {
    .suggested-left > #control-buttons { float: none; }
  }
  @media (max-height: 350px) {
    h1 { margin: 0 0 15px; }
    .icon-offline { margin: 0 0 10px; }
    .interstitial-wrapper { margin-top: 5%; }
    .nav-wrapper { margin-top: 30px; }
  }
  @media (max-width: 360px) and (max-height: 480px) {
    .offline .interstitial-wrapper { padding-top: 60px; }
    .offline .runner-container { top: 8px; }
  }
  @media (min-height: 240px) and (orientation: landscape) {
    .offline .interstitial-wrapper { margin-bottom: 90px; }
    .icon-offline { margin-bottom: 20px; }
  }
  @media (max-height: 320px) and (orientation: landscape) {
    .icon-offline { margin-bottom: 0; }
    .offline .runner-container { top: 10px; }
  }
  @media (max-width: 240px) {
    button { padding-inline-end: 12px; padding-inline-start: 12px; }
    .interstitial-wrapper { overflow: inherit; padding: 0 8px; }
  }
  @media (max-width: 120px) { button { width: auto; } }

  /* --- ours: the shell the error page lives in ----------------------------- */
  /* No universal margin reset: the error page depends on the UA's h1/p/ul
     margins, which is most of why it lays out the way it does. */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: system-ui, sans-serif;
    font-size: 75%;                       /* 125% x 75% = the page's 15px */
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
    transition: background .7s ease;
  }
  body.playing { background: #10131a; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* The real page's 8px body margin, without letting the page scroll. */
  /* Scrolls when the content does not fit, exactly as the real page does -- on a
     short window Chrome's error page is scrollable, and the scrollbar it takes is
     part of the layout. body itself stays fixed so the canvas never scrolls. */
  #offline { position: fixed; inset: 0; padding: 8px; overflow: auto;
             transition: opacity .45s ease; }
  /* Chrome drops the body margin at these sizes; for us that is #offline's padding. */
  @media (max-width: 420px) and (orientation: portrait), (max-height: 560px) {
    #offline { padding: 0; }
  }
  #offline.gone { opacity: 0; pointer-events: none; }
  /* Only shown when a challenge link was opened; absent otherwise, so the
     default page keeps Chrome's exact box model. */
  #challenge { color: var(--error-code-color); font-size: .8em; margin-top: 6px; }
  #challenge b { color: var(--heading-color); font-weight: 600; }

  /* ---- in-game hud ------------------------------------------------------- */
  :root {
    --ink: #202124; --shadow: 0 1px 5px rgba(255,255,255,.8); --veil: rgba(255,255,255,.34);
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8eaed; --shadow: 0 1px 6px rgba(0,0,0,.7); --veil: rgba(32,33,36,.34); }
  }
  body.playing { --ink: #fff; --shadow: 0 2px 14px rgba(0,0,0,.55); --veil: rgba(8,10,16,.42); }

  .hud { position: fixed; margin: 0; pointer-events: none; color: var(--ink);
         text-shadow: var(--shadow); opacity: 0;
         transition: color .6s ease, opacity .6s ease;
         font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  body.playing .hud { opacity: 1; }
  #topright { top: 14px; right: 16px; text-align: right; }
  #score { font-size: 30px; font-weight: 700; letter-spacing: .06em; }
  #best { opacity: .7; font-size: 12px; }
  #mult { color: #ffe08a; font-size: 17px; font-weight: 700; min-height: 22px; }
  /* No `opacity` here: an id selector would beat .hud's opacity:0 and leak the
     label into the error page. Fade is owned by .hud / body.playing .hud alone. */
  #biome { top: 14px; left: 16px; letter-spacing: .28em;
           text-transform: uppercase; font-size: 11px; }
  body.playing #biome { opacity: .55; }
  #seedline { bottom: 12px; left: 16px; font-size: 11px; pointer-events: auto; opacity: 0; }
  body.playing #seedline { opacity: .5; }
  #seedline a { color: inherit; }

  #overlay {
    position: fixed; inset: 0; display: grid; place-content: center; text-align: center;
    gap: 14px; background: var(--veil); backdrop-filter: blur(2px); color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    transition: opacity .2s ease, background .6s ease, color .6s ease;
    text-shadow: var(--shadow);
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #title { font-size: clamp(40px, 11vw, 78px); font-weight: 800; letter-spacing: .10em; }
  #sub { opacity: .88; line-height: 1.9; font-size: 14px; }
  .go { display: inline-block; margin-top: 6px; opacity: .75;
        animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  #sub b { color: #ffe08a; font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .go { animation: none; } }

  /* Offered on the death screen, never on the error page: the intro is a
     pixel-for-pixel copy of Chrome's and an install button would give that away.
     Right after your first run is when you want it anyway. */
  #install {
    justify-self: center; margin-top: 4px; padding: 9px 20px;
    font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: .06em; color: var(--ink); background: transparent;
    border: 1px solid currentColor; border-radius: 20px; cursor: pointer;
    opacity: .75; transition: opacity .2s ease;
  }
  #install:hover { opacity: 1; }
  #installhint {
    margin-top: 6px; opacity: .5; font-size: 12px; letter-spacing: .04em;
  }
</style>
</head>
<body class="neterror">
  <canvas id="gl"></canvas>

  <div id="offline" class="offline">
    <div id="main-frame-error" class="interstitial-wrapper">
      <div id="main-content">
        <div class="icon icon-offline"></div>
        <div id="main-message">
          <h1><span>No internet</span></h1>
          <div id="suggestions-list">
            <p>Try:</p>
            <ul>
              <li>Checking the network cables, modem, and router</li>
              <li>Reconnecting to Wi-Fi</li>
              <li>Running Network Diagnostics</li>
            </ul>
          </div>
          <div class="error-code" id="err">ERR_INTERNET_DISCONNECTED</div>
        </div>
      </div>
      <div id="buttons" class="nav-wrapper suggested-left">
        <div id="control-buttons"><button id="reload">Reload</button></div>
      </div>
      <div class="runner-container"></div>
    </div>
  </div>

  <div class="hud" id="biome"></div>
  <div class="hud" id="topright">
    <div id="score">00000</div>
    <div id="best"></div>
    <div id="mult"></div>
  </div>
  <div class="hud" id="seedline"><span id="seed"></span></div>

  <div id="overlay" class="hidden">
    <div id="title"></div>
    <div id="sub"></div>
    <button id="install" hidden>install it</button>
    <div id="installhint" hidden></div>
  </div>

  <script>
    (function () {
      let shown = false;
      function fail(what, detail) {
        if (shown) return; shown = true;
        var o = document.getElementById('overlay');
        o.classList.remove('hidden');
        document.getElementById('title').textContent = 'ERROR';
        document.getElementById('sub').innerHTML =
          '<div style="max-width:70ch;text-align:left;white-space:pre-wrap;font-size:12px">'
          + what + '\n' + detail + '</div>';
      }
      addEventListener('error', e => fail(e.message, (e.error && e.error.stack) || (e.filename + ':' + e.lineno)));
      addEventListener('unhandledrejection', e => fail('Unhandled rejection',
        (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason)));
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
  <script>
    // An offline page that needs a connection to load is only half the joke.
    // Registered after load so it never competes with the first frame, and
    // guarded because service workers need a secure context -- opening the file
    // straight off disk should still play.
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
